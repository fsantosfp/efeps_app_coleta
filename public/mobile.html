<!DOCTYPE html>
<html class="dark" lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Coleta Operacional - Sistema de Logística Reversa</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700&amp;family=Inter:wght@400;600&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "surface-bright": "#31394d",
            "on-primary": "#1d00a5",
            "primary-fixed": "#e2dfff",
            "inverse-on-surface": "#283044",
            "surface-container-low": "#131b2e",
            "secondary": "#4edea3",
            "on-tertiary-fixed-variant": "#7b2f00",
            "on-error": "#690005",
            "inverse-surface": "#dae2fd",
            "on-surface": "#dae2fd",
            "secondary-fixed-dim": "#4edea3",
            "on-secondary": "#003824",
            "tertiary-container": "#a44100",
            "on-secondary-fixed-variant": "#005236",
            "on-error-container": "#ffdad6",
            "secondary-fixed": "#6ffbbe",
            "surface-container": "#171f33",
            "tertiary-fixed-dim": "#ffb695",
            "on-tertiary-fixed": "#351000",
            "error": "#ffb4ab",
            "on-background": "#dae2fd",
            "surface-variant": "#2d3449",
            "outline": "#918fa1",
            "primary": "#c3c0ff",
            "surface-container-high": "#222a3d",
            "surface": "#0b1326",
            "primary-container": "#4f46e5",
            "on-tertiary": "#571f00",
            "background": "#0b1326",
            "surface-container-lowest": "#060e20",
            "on-primary-fixed": "#0f0069",
            "error-container": "#93000a",
            "primary-fixed-dim": "#c3c0ff",
            "on-secondary-fixed": "#002113",
            "surface-dim": "#0b1326",
            "on-tertiary-container": "#ffd2be",
            "inverse-primary": "#4d44e3",
            "on-primary-fixed-variant": "#3323cc",
            "outline-variant": "#464555",
            "tertiary": "#ffb695",
            "on-primary-container": "#dad7ff",
            "secondary-container": "#00a572",
            "surface-tint": "#c3c0ff",
            "surface-container-highest": "#2d3449",
            "on-surface-variant": "#c7c4d8",
            "tertiary-fixed": "#ffdbcc",
            "on-secondary-container": "#00311f"
          },
          "borderRadius": {
            "DEFAULT": "1rem",
            "lg": "2rem",
            "xl": "3rem",
            "full": "9999px"
          },
          "spacing": {
            "stack-gap": "16px",
            "element-gap": "8px",
            "container-padding": "24px",
            "unit": "4px",
            "section-margin": "32px"
          },
          "fontFamily": {
            "headline-md": ["Hanken Grotesk"],
            "body-lg": ["Inter"],
            "label-caps": ["Inter"],
            "body-md": ["Inter"],
            "headline-sm": ["Hanken Grotesk"],
            "headline-lg": ["Hanken Grotesk"]
          },
          "fontSize": {
            "headline-md": ["24px", {"lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600"}],
            "body-lg": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
            "label-caps": ["12px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600"}],
            "body-md": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
            "headline-sm": ["20px", {"lineHeight": "1.4", "fontWeight": "600"}],
            "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}]
          }
        },
      },
    }
  </script>
  <style>
    .backdrop-blur-glass {
      backdrop-filter: blur(20px);
      background: rgba(19, 27, 46, 0.85);
    }
    .pulse-emerald {
      animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(78, 222, 163, 0.4); }
      70% { box-shadow: 0 0 0 15px rgba(78, 222, 163, 0); }
      100% { box-shadow: 0 0 0 0 rgba(78, 222, 163, 0); }
    }
    .haptic-active:active {
      transform: scale(0.96);
    }
  </style>
  <style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background font-body-md overflow-hidden select-none">
  <!-- TopAppBar -->
  <header class="fixed top-0 left-0 w-full z-40 bg-surface flex justify-between items-center px-container-padding py-4 border-b border-outline-variant/10">
    <div class="flex items-center gap-3">
      <span class="material-symbols-outlined text-primary" data-icon="inventory_2">inventory_2</span>
      <h1 class="font-headline-sm text-headline-sm font-bold text-on-surface">Coleta Operacional</h1>
    </div>
    <div class="flex items-center gap-2">
      <span id="wifi-icon" class="material-symbols-outlined text-secondary" data-icon="wifi">wifi</span>
      <span id="network-status" class="text-label-caps font-label-caps text-on-surface-variant">ONLINE</span>
    </div>
  </header>

  <!-- Main Content Canvas -->
  <main class="relative h-screen flex flex-col items-center justify-center px-container-padding pb-32">
    <!-- Background Atmosphere -->
    <div class="absolute inset-0 pointer-events-none opacity-20 overflow-hidden">
      <div class="absolute -top-24 -left-24 w-96 h-96 bg-primary rounded-full blur-[100px]"></div>
      <div class="absolute -bottom-24 -right-24 w-96 h-96 bg-secondary rounded-full blur-[100px]"></div>
    </div>

    <!-- Central Action Container -->
    <div class="relative z-10 w-full max-w-sm flex flex-col items-center space-y-section-margin">
      <div class="text-center space-y-2">
        <p class="text-label-caps font-label-caps text-primary tracking-widest uppercase">Próximo Item</p>
        <h2 class="text-headline-md font-headline-md text-on-surface">Digitalize a Etiqueta</h2>
      </div>

      <!-- Large Tactile Capture Button -->
      <label id="capture-label" class="group relative flex flex-col items-center justify-center w-64 h-64 bg-surface-container-high rounded-full border border-white/10 shadow-2xl cursor-pointer transition-all duration-300 hover:bg-surface-variant active:scale-95 overflow-hidden haptic-active" for="capture-input">
        <div class="absolute inset-0 bg-gradient-to-tr from-primary/10 to-transparent"></div>
        <div class="relative flex flex-col items-center gap-4" id="capture-button-content">
          <div class="w-20 h-20 rounded-full bg-primary-container flex items-center justify-center text-white shadow-lg group-hover:scale-110 transition-transform">
            <span class="material-symbols-outlined text-[40px]" data-icon="photo_camera" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
          </div>
          <span class="text-label-caps font-label-caps text-on-surface-variant text-center px-8 leading-tight">Capturar Foto da Etiqueta</span>
        </div>
        
        <!-- Loading indicator -->
        <div class="hidden absolute flex flex-col items-center justify-center gap-4 text-primary" id="upload-spinner">
          <div class="w-16 h-16 border-4 border-primary border-t-transparent rounded-full animate-spin"></div>
          <span class="text-label-caps font-label-caps">Enviando...</span>
        </div>

        <!-- Hidden Input -->
        <input accept="image/*" capture="camera" class="hidden" id="capture-input" onchange="handlePhotoUpload(event)" type="file"/>
      </label>

      <div class="flex items-center gap-stack-gap text-on-surface-variant/60">
        <span class="material-symbols-outlined text-[18px]" data-icon="lightbulb">lightbulb</span>
        <p class="text-body-md font-body-md italic">Dica: Centralize a etiqueta e evite reflexos.</p>
      </div>
    </div>
  </main>

  <!-- Success Feedback Overlay (Initially Hidden) -->
  <div class="fixed inset-0 z-50 flex items-end justify-center pointer-events-none transition-all duration-500 transform translate-y-full px-container-padding pb-container-padding" id="success-overlay">
    <div class="w-full max-w-md backdrop-blur-glass p-8 rounded-lg border border-white/5 shadow-2xl pointer-events-auto flex flex-col items-center gap-6">
      <!-- Animated Check Icon -->
      <div class="relative">
        <div class="w-16 h-16 rounded-full bg-secondary/10 flex items-center justify-center pulse-emerald">
          <span class="material-symbols-outlined text-secondary text-[40px] font-bold" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
        </div>
      </div>
      <div class="text-center space-y-1">
        <h3 class="text-headline-sm font-headline-sm text-secondary">Foto enviada!</h3>
        <p class="text-on-surface-variant font-body-md">A etiqueta foi enfileirada para processamento.</p>
      </div>
      <!-- Action Cluster -->
      <div class="w-full grid grid-cols-1 gap-stack-gap mt-4">
        <button class="w-full py-4 bg-primary text-on-primary font-label-caps rounded-DEFAULT shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2" onclick="reopenCamera()">
          <span class="material-symbols-outlined" data-icon="qr_code_scanner">qr_code_scanner</span>
          ESCANEAR PRÓXIMA ETIQUETA
        </button>
        <button class="w-full py-4 border border-outline-variant text-on-surface font-label-caps rounded-DEFAULT hover:bg-surface-variant/30 active:scale-95 transition-all" onclick="resetFlow()">
          FINALIZAR COLETA
        </button>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation Bar (Placeholder / Simulado para manter UX) -->
  <nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 py-3 bg-surface-container-low border-t border-outline-variant/10 z-30">
    <div class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-2xl px-4 py-2 transition-all duration-200 scale-95 cursor-pointer">
      <span class="material-symbols-outlined" data-icon="qr_code_scanner" style="font-variation-settings: 'FILL' 1;">qr_code_scanner</span>
      <span class="text-label-caps font-label-caps mt-1">Coletar</span>
    </div>
    <div class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-2 hover:bg-surface-variant rounded-2xl transition-all cursor-pointer" onclick="window.location.href='/admin'">
      <span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
      <span class="text-label-caps font-label-caps mt-1">Admin</span>
    </div>
  </nav>

  <script>
    // Gerenciador de vibração para haptic feedback
    function triggerHaptic(pattern = 5) {
      if (window.navigator && window.navigator.vibrate) {
        window.navigator.vibrate(pattern);
      }
    }

    async function handlePhotoUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      triggerHaptic([15, 30, 15]);

      // Mostra tela de carregamento
      const buttonContent = document.getElementById('capture-button-content');
      const spinner = document.getElementById('upload-spinner');
      const label = document.getElementById('capture-label');

      buttonContent.classList.add('hidden');
      spinner.classList.remove('hidden');
      label.classList.add('pointer-events-none');

      const formData = new FormData();
      formData.append('etiqueta', file);

      try {
        const response = await fetch('/api/upload', {
          method: 'POST',
          body: formData
        });
        
        const result = await response.json();

        if (response.ok && result.success) {
          // Upload bem sucedido
          showSuccessModal();
        } else {
          alert('Erro ao enviar foto: ' + (result.message || 'Erro desconhecido.'));
          resetFlow();
        }
      } catch (error) {
        console.error('Erro de rede ao enviar foto:', error);
        alert('Erro de conexão ao enviar foto para o servidor.');
        resetFlow();
      }
    }

    function showSuccessModal() {
      const overlay = document.getElementById('success-overlay');
      overlay.classList.remove('translate-y-full', 'pointer-events-none');
      triggerHaptic([20, 50, 20]);
    }

    function reopenCamera() {
      resetFlow();
      // Simula clique automático para abrir a câmera imediatamente
      setTimeout(() => {
        document.getElementById('capture-input').click();
      }, 300);
    }

    function resetFlow() {
      const overlay = document.getElementById('success-overlay');
      overlay.classList.add('translate-y-full', 'pointer-events-none');
      
      const buttonContent = document.getElementById('capture-button-content');
      const spinner = document.getElementById('upload-spinner');
      const label = document.getElementById('capture-label');

      buttonContent.classList.remove('hidden');
      spinner.classList.add('hidden');
      label.classList.remove('pointer-events-none');

      // Limpa input
      document.getElementById('capture-input').value = "";
    }

    // Monitoramento simples de rede local (online/offline)
    window.addEventListener('online', () => {
      document.getElementById('wifi-icon').className = "material-symbols-outlined text-secondary";
      document.getElementById('network-status').innerText = "ONLINE";
    });
    window.addEventListener('offline', () => {
      document.getElementById('wifi-icon').className = "material-symbols-outlined text-error";
      document.getElementById('network-status').innerText = "OFFLINE";
    });
  </script>
</body>
</html>
